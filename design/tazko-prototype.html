<title>Tazko Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: slim prototype bar on top; below it either a centered auth card, or an app shell (left rail + page).
   Tokens: calm cool-white surfaces, indigo accent, soft semantic colors. */
:root{
  --bg:#F5F5FA; --surface:#FFFFFF; --sunken:#EEEEF6; --ink:#1B1B2F; --muted:#66667F; --line:#E2E2EE;
  --accent:#4B4FD8; --accent-ink:#FFFFFF; --accent-soft:#E9E9FC; --accent-line:#C9CAF5;
  --ok:#1C7C54; --ok-bg:#DDF3E8; --warn:#9A6212; --warn-bg:#FBEFD5; --bad:#B8344A; --bad-bg:#FBE3E7;
  --proto:#1B1B2F; --proto-ink:#E8E8F5; --shadow:0 8px 30px rgba(27,27,47,.12);
  --c0-bg:#E1E2FB; --c0-fg:#3A3DB0; --c1-bg:#D4F1EA; --c1-fg:#17695A; --c2-bg:#FBE9C9; --c2-fg:#845411;
  --c3-bg:#FADDE3; --c3-fg:#A02E45; --c4-bg:#E4E8D3; --c4-fg:#516025;
  --sans:"Hanken Grotesk","Segoe UI",system-ui,sans-serif; --mono:"DM Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12121C; --surface:#1B1B29; --sunken:#151522; --ink:#E9E9F6; --muted:#9A9AB5; --line:#2D2D42;
  --accent:#8B8EF5; --accent-ink:#12122A; --accent-soft:#25264A; --accent-line:#3C3E7A;
  --ok:#5DD3A0; --ok-bg:#163428; --warn:#E8B45C; --warn-bg:#3A2D12; --bad:#F08196; --bad-bg:#3E1D26;
  --proto:#0A0A12; --proto-ink:#C9C9E0; --shadow:0 8px 30px rgba(0,0,0,.45);
  --c0-bg:#2A2B5E; --c0-fg:#B9BBFA; --c1-bg:#163A33; --c1-fg:#8ADBC8; --c2-bg:#443214; --c2-fg:#F0C47A;
  --c3-bg:#4A2230; --c3-fg:#F4A3B4; --c4-bg:#2E3519; --c4-fg:#C2D27F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12121C; --surface:#1B1B29; --sunken:#151522; --ink:#E9E9F6; --muted:#9A9AB5; --line:#2D2D42;
  --accent:#8B8EF5; --accent-ink:#12122A; --accent-soft:#25264A; --accent-line:#3C3E7A;
  --ok:#5DD3A0; --ok-bg:#163428; --warn:#E8B45C; --warn-bg:#3A2D12; --bad:#F08196; --bad-bg:#3E1D26;
  --proto:#0A0A12; --proto-ink:#C9C9E0; --shadow:0 8px 30px rgba(0,0,0,.45);
  --c0-bg:#2A2B5E; --c0-fg:#B9BBFA; --c1-bg:#163A33; --c1-fg:#8ADBC8; --c2-bg:#443214; --c2-fg:#F0C47A;
  --c3-bg:#4A2230; --c3-fg:#F4A3B4; --c4-bg:#2E3519; --c4-fg:#C2D27F; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
h1{font-size:1.6rem} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:.4em 0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.ic{width:18px;height:18px;flex:none}
.mono{font-family:var(--mono);font-size:.85em}
.muted{color:var(--muted)}
[hidden]{display:none!important}

/* prototype bar */
.proto{position:sticky;top:0;z-index:30;background:var(--proto);color:var(--proto-ink);display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding-block:8px;padding-top:max(8px,env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:.8rem}
.proto b{font-weight:600}
.proto a,.proto button{color:var(--proto-ink);background:none;border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:3px 10px;cursor:pointer;text-decoration:none;font-size:.8rem}
.proto .sp{flex:1}

/* buttons, inputs */
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.9rem;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{height:30px;padding:0 10px;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.field label{font-size:.82rem;font-weight:600}
input[type=text],input[type=email],input[type=number],input[type=search],select{height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;min-width:0;width:100%}
select{padding-right:8px;width:auto}
input:focus,select:focus{border-color:var(--accent);outline:2px solid var(--accent-soft)}
.hint{font-size:.82rem;color:var(--muted);max-width:60ch}

/* pills, avatars, bars */
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:99px;font-size:.75rem;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.accent{background:var(--accent-soft);color:var(--accent)}
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-size:.75rem;font-weight:700;flex:none}
.av.sq{border-radius:8px}
.c0{background:var(--c0-bg);color:var(--c0-fg)} .c1{background:var(--c1-bg);color:var(--c1-fg)} .c2{background:var(--c2-bg);color:var(--c2-fg)}
.c3{background:var(--c3-bg);color:var(--c3-fg)} .c4{background:var(--c4-bg);color:var(--c4-fg)}
.bar{height:6px;border-radius:99px;background:var(--sunken);overflow:hidden;width:110px}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who div{min-width:0;line-height:1.3} .who small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis}

/* shell */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:calc(100vh - 44px)}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:14px 12px 14px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500;border:0;background:none;cursor:pointer;width:100%;text-align:left}
.nav:hover{background:var(--sunken)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav[aria-disabled=true]{color:var(--muted);cursor:default}
.nav .pill{margin-left:auto}
.rail .grow{flex:1}
.rail h4{margin:14px 10px 4px;font:600 .7rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.switch{position:relative;margin-bottom:8px}
.switch>button{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left}
.switch>button b{display:block;line-height:1.2;font-size:.92rem} .switch>button small{color:var(--muted)}
.menu{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px}
.menu .item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.menu .item:hover{background:var(--sunken)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.page{padding:28px max(20px,env(safe-area-inset-right,0px)) 64px 28px;max-width:1120px;width:100%;min-width:0}
.head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head .sp{flex:1}
.crumb{font-size:.85rem;color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--muted)}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;align-items:center;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .rail h4{display:none} .rail .grow{display:none}
  .switch{width:100%} .nav{width:auto}
  .page{padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
}

/* boxes, tables */
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;min-width:0}
.box>h2{margin-bottom:10px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:16px}
.box .tw{border:0;border-radius:0;margin:0 -18px -18px;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:600 .72rem var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunken);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row .grow{flex:1;min-width:180px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--accent);border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat small{color:var(--muted);display:block}.stat b{font-size:1.25rem;font-variant-numeric:tabular-nums}
.switchbtn{position:relative;width:38px;height:22px;border-radius:99px;border:0;background:var(--line);cursor:pointer;padding:0}
.switchbtn::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switchbtn[aria-checked=true]{background:var(--accent)} .switchbtn[aria-checked=true]::after{transform:translateX(16px)}
.danger-zone{border-color:var(--bad)}
.log li{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:baseline}
.log{list-style:none;margin:0;padding:0}.log li:last-child{border-bottom:0}
.log time{color:var(--muted);font-size:.82rem}
@media (max-width:600px){.log li{grid-template-columns:1fr;gap:2px}}

/* modal, toast */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.scrim{position:absolute;inset:0;background:rgba(15,15,30,.5)}
.sheet{position:relative;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(480px,100%);padding:22px;max-height:calc(100vh - 32px);overflow:auto}
.sheet .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* auth + index */
.center{min-height:calc(100vh - 44px);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(900px 420px at 50% -10%,var(--accent-soft),transparent 70%),var(--bg)}
.auth{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 28px;box-shadow:var(--shadow);text-align:center}
.auth .mark{margin:0 auto 18px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.95rem;margin-top:22px}
.gbtn:hover{background:var(--sunken)}
.gdot{width:20px;height:20px;border-radius:50%;background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0);display:inline-grid;place-items:center}
.gdot i{width:12px;height:12px;border-radius:50%;background:var(--surface);display:block}
.note{background:var(--sunken);border-radius:10px;padding:10px 14px;font-size:.85rem;color:var(--muted);text-align:left;margin-top:16px}
.empty{text-align:center;padding:56px 16px;border:1.5px dashed var(--line);border-radius:14px;background:var(--surface)}
.empty svg{margin:0 auto 14px;display:block}
.idx{max-width:900px;margin:0 auto;padding:36px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
.idx .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:14px 0 30px}
.idx a.tile{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.idx a.tile:hover{border-color:var(--accent);background:var(--accent-soft)}
.idx .tile small{display:block;color:var(--muted)}
.idx .tile.later{opacity:.55;pointer-events:none}
.msh{display:flex;align-items:center;gap:10px;margin-top:22px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== Round 2: projects, boards, card, notifications, templates, dashboard ===== */
:root{--lst:rgba(243,243,250,.95);--lst-sh:0 1px 3px rgba(20,20,40,.18);--hl:rgba(255,255,255,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--lst:rgba(24,24,38,.95)}}
:root[data-theme="dark"]{--lst:rgba(24,24,38,.95)}
.ibtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:inherit;cursor:pointer;position:relative;flex:none}
.ibtn:hover{background:rgba(127,127,160,.22)}
.ibtn.sm{width:26px;height:26px}
.ibtn .ic{width:17px;height:17px}
.dot{position:absolute;top:1px;right:1px;min-width:16px;height:16px;border-radius:99px;background:#e11d48;color:#fff;font:700 .65rem/16px var(--sans);font-style:normal;text-align:center;padding:0 4px}
.sbtn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px 0 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;font-size:.85rem;min-width:170px}
.sbtn kbd,.kbd{font:500 .72rem var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--sunken);color:var(--muted)}
.sbtn kbd{margin-left:auto}
.tools{display:flex;align-items:center;gap:6px}
.tools .ibtn{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--sunken);color:var(--muted);border:0;cursor:pointer}
.tabs2{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 18px;overflow-x:auto}
.tabs2 button{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs2 button.on{color:var(--accent);border-color:var(--accent)}
.tabs2 button[disabled]{opacity:.5;cursor:default}

/* project & board tiles */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:26px}
.ptile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:left;color:inherit;font:inherit;min-width:0}
.ptile:hover{border-color:var(--accent-line);box-shadow:var(--shadow)}
.ptile h3{font-size:1.02rem}.ptile p{margin:0;color:var(--muted);font-size:.85rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ptile .foot{display:flex;align-items:center;gap:8px;margin-top:auto;color:var(--muted);font-size:.8rem}
.stack{display:inline-flex}.stack .av{width:26px;height:26px;font-size:.66rem;border:2px solid var(--surface);margin-left:-7px}.stack .av:first-child{margin-left:0}
.btile{position:relative;height:104px;border-radius:12px;padding:12px;color:#fff;cursor:pointer;border:0;text-align:left;font:inherit;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;background-size:cover;min-width:0}
.btile::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.34))}
.btile>*{position:relative}
.btile b{font-size:.98rem;text-shadow:0 1px 2px rgba(0,0,0,.3);overflow-wrap:anywhere}
.btile small{opacity:.92}
.btile .star{position:absolute;top:8px;right:8px;opacity:0;color:#fff;background:rgba(0,0,0,.25);border-radius:6px}
.btile:hover .star,.btile .star[aria-pressed=true],.btile:focus-within .star{opacity:1}
.btile .star[aria-pressed=true] .ic{fill:#fbbf24;stroke:#fbbf24}
.btile.new{background:var(--sunken);color:var(--muted);align-items:center;justify-content:center;border:1.5px dashed var(--line)}
.btile.new::before{display:none}.btile.new:hover{border-color:var(--accent);color:var(--accent)}
.sechd{display:flex;align-items:center;gap:8px;margin:6px 0 10px;font-weight:700}
.sechd .ic{color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:44px;height:32px;border-radius:7px;border:2px solid transparent;cursor:pointer;padding:0}
.sw[aria-pressed=true]{border-color:var(--accent);outline:2px solid var(--accent-soft)}
.switchrow{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.switchrow:last-child{border-bottom:0}
.switchrow small{display:block;color:var(--muted)}

/* board */
.bd{height:calc((100vh - var(--pb,44px)) / var(--zm,1));display:flex;flex-direction:column;background-size:cover;background-position:center;min-width:0}
.bt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px max(16px,env(safe-area-inset-right,0px)) 7px max(16px,env(safe-area-inset-left,0px));background:rgba(12,12,32,.5);color:#fff}
.bt a{color:#fff;text-decoration:none}.bt .ibtn,.bh .ibtn{color:#fff}
.bt .sp,.bh .sp{flex:1}
.crumb2{display:flex;gap:8px;align-items:center;font-size:.88rem;opacity:.95;min-width:0}
.crumb2 span{opacity:.6}
.bh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:rgba(12,12,32,.32);color:#fff}
.bname{margin:0;font-size:1.15rem;padding:4px 8px;border-radius:7px;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.bname:hover{background:var(--hl)}
.bh .chip{background:var(--hl);color:#fff}
.bh .btn{background:var(--hl);border-color:transparent;color:#fff;height:32px}
.bh .btn:hover{background:rgba(255,255,255,.3)}
.vtabs{display:flex;background:rgba(0,0,0,.25);border-radius:9px;padding:2px}
.vtabs button{border:0;background:none;color:#fff;padding:4px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:.85rem}
.vtabs button.on{background:rgba(255,255,255,.95);color:#1b1b2f}
.vtabs button[disabled]{opacity:.55;cursor:default}
.vtabs small{opacity:.8;font-weight:500}
.live{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:99px;border:0;background:var(--hl);color:#fff;cursor:pointer;font-size:.8rem;font-weight:600}
.live i{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 rgba(52,211,153,.7);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.bh .stack .av{border-color:rgba(40,40,80,.9)}
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:6px max(16px,env(safe-area-inset-left,0px));background:rgba(12,12,32,.45);color:#fff;font-size:.85rem}
.fbar button{background:var(--hl);border:0;color:#fff;border-radius:6px;padding:2px 8px;cursor:pointer}
.ro-banner{background:var(--warn-bg);color:var(--warn);padding:6px 16px;font-size:.85rem;font-weight:600}
.lists{flex:1;min-height:0;display:flex;gap:12px;align-items:flex-start;overflow-x:auto;overflow-y:hidden;padding:12px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));scroll-snap-type:x proximity}
.ls{flex:0 0 288px;width:288px;max-height:100%;display:flex;flex-direction:column;background:var(--lst);border-radius:12px;box-shadow:var(--lst-sh);scroll-snap-align:start}
.ls.collapsed{flex-basis:46px;width:46px;align-items:center;padding:8px 0;cursor:pointer}
.ls.collapsed button{writing-mode:vertical-rl;border:0;background:none;font-weight:700;color:var(--ink);cursor:pointer;padding:6px}
.ls.dragging,.cd.dragging{opacity:.4}
.lh{display:flex;align-items:center;gap:4px;padding:8px 6px 6px 12px;cursor:grab}
.lt{flex:1;margin:0;font-size:.92rem;padding:3px 4px;border-radius:6px;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.lt:hover{background:var(--sunken)}
.cnt{font-size:.75rem;color:var(--muted);font-weight:600}
.cards{overflow-y:auto;padding:2px 8px 4px;display:flex;flex-direction:column;gap:8px;min-height:10px}
.cd{position:relative;background:var(--surface);border-radius:9px;box-shadow:var(--lst-sh);cursor:pointer;border:1px solid transparent;overflow:hidden;flex:none}
.cd:hover,.cd:focus-visible{border-color:var(--accent)}
.cd.hide{display:none}
.cd.flash{animation:flash 1.6s}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--lst-sh)}}
.cv{height:34px}.cv.img{height:110px}
.cb{padding:8px 10px 8px}
.lbs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.lb{display:inline-block;border-radius:5px;font-size:.72rem;font-weight:700;padding:1px 8px;line-height:1.5;border:0;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbs.compact .lb{width:38px;height:8px;padding:0;font-size:0;border-radius:4px}
.ct{display:flex;align-items:flex-start}
.ttl{font-size:.9rem;overflow-wrap:anywhere;line-height:1.35;flex:1}
.chk{flex:none;width:0;height:18px;border-radius:50%;border:2px solid var(--muted);background:transparent;opacity:0;margin-right:0;padding:0;cursor:pointer;display:inline-grid;place-items:center;color:#fff;transition:width .12s,opacity .12s,margin .12s}
.cd:hover .chk,.cd:focus-within .chk,.chk[aria-checked=true]{width:18px;opacity:1;margin-right:7px;margin-top:1px}
.chk[aria-checked=true]{background:var(--ok);border-color:var(--ok)}
.chk .ic{width:11px;height:11px;stroke-width:3}
.cd.done .ttl{color:var(--muted)}
.bdgs{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:7px;color:var(--muted);font-size:.76rem}
.bdg{display:inline-flex;align-items:center;gap:4px;border-radius:5px;padding:0 3px}
.bdg .ic{width:14px;height:14px}
.bdg.ok{background:var(--ok-bg);color:var(--ok);padding:1px 6px}
.bdg.warn{background:var(--warn-bg);color:var(--warn);padding:1px 6px}
.bdg.bad{background:var(--bad-bg);color:var(--bad);padding:1px 6px}
.bdgs .av{width:24px;height:24px;font-size:.62rem}
.bdgs .av+.av{margin-left:-6px}
.bdgs .mm{margin-left:auto;display:inline-flex}
.fld{background:var(--sunken);border-radius:5px;padding:0 6px;color:var(--ink)}
.fld b{font-weight:600;color:var(--muted)}
.qe{position:absolute;top:6px;right:6px;opacity:0;background:var(--surface);color:var(--muted);box-shadow:var(--lst-sh)}
.cd:hover .qe,.cd:focus-within .qe{opacity:1}
.cv+.cb+.qe{top:40px}
.addc{display:flex;align-items:center;gap:8px;flex:1;border:0;background:none;color:var(--muted);padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;font-weight:500}
.addc:hover{background:var(--sunken);color:var(--ink)}
.lf{display:flex;align-items:center;padding:4px 6px 6px}
.cmp{padding:6px 8px 8px}
.cmp textarea,.inl-i{width:100%;border:1px solid var(--accent);border-radius:8px;padding:8px 10px;font:inherit;background:var(--surface);color:var(--ink);resize:none;min-height:60px}
.inl-i{min-height:0;height:34px;padding:0 8px}
textarea.inl-i{height:auto;min-height:60px;padding:8px}
.cmp .row{margin-top:8px}
.ph{flex:none;height:38px;border-radius:9px;border:2px dashed var(--accent);background:var(--accent-soft)}
.lph{flex:0 0 288px;height:90px;border-radius:12px;border:2px dashed #fff;background:var(--hl)}
.addl{flex:0 0 288px;background:rgba(255,255,255,.28);border-radius:12px;padding:12px;color:#fff;border:0;cursor:pointer;text-align:left;font-weight:600;display:flex;gap:8px;align-items:center}
.addl:hover{background:rgba(255,255,255,.4)}
.addl.open{background:var(--lst);color:var(--ink);display:block;cursor:default}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-act]');
 if(!e.target.closest('.switch')&&S.menu){S.menu=false;render()}
 if(!t)return;var a=t.getAttribute('data-act'),slug=t.getAttribute('data-slug'),i=+t.getAttribute('data-i');
 if(a==='theme'){var r=document.documentElement,dark=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);r.setAttribute('data-theme',dark?'light':'dark');return}
 if(a==='close'){closeModal();return}
 if(a==='go'){location.hash=t.getAttribute('data-to');return}
 if(a==='menu'){S.menu=!S.menu;render();return}
 if(a==='co'){S.cur=t.getAttribute('data-k');S.menu=false;render();toast('Switched to '+co().name);return}
 if(a==='open-co'){S.sel=t.getAttribute('data-k');S.tab='members';location.hash='admin-company';return}
 if(a==='tab'){S.tab=t.getAttribute('data-t');render();return}
 if(a==='new-co'){dNewCo();return}
 if(a==='suspend'||a==='resume'){var c=sc();c.status=a==='suspend'?'suspended':'active';log(S.user.name,(a==='suspend'?'suspended':'resumed')+' company',c.name,'company');render();toast(c.name+(a==='suspend'?' suspended':' resumed'));return}
 if(a==='save-co'){var c2=sc(),nm=document.getElementById('s-name').value.trim(),lm=+document.getElementById('s-lim').value;if(nm)c2.name=nm;if(lm>0)c2.limit=lm;render();toast('Saved');return}
 if(a==='del-co'){dDelete();return}
 if(a==='add-admin'){dAddAdmin(slug,i);return}
 if(a==='to-manage'){location.hash='manage-projects';return}
 if(a==='new-proj'){dNewProj();return}
 if(a==='proj-arch'){var pa=co().projects[i];pa.status=pa.status==='archived'?'active':'archived';log(S.user.name,(pa.status==='archived'?'archived':'restored')+' project',pa.name+' in '+co().name,'company');render();toast(pa.name+(pa.status==='archived'?' archived':' restored'));return}
 if(a==='proj-del'){dDelProj(i);return}
 if(a==='projdel-go'){var pd=co().projects.splice(S.dp,1)[0];log(S.user.name,'deleted project',pd.name+' in '+co().name,'company');closeModal();render();toast(pd.name+' moved to trash');return}
 if(a==='del-go'){var c3=sc();log(S.user.name,'deleted company',c3.name,'company');delete S.companies[S.sel];if(S.cur===S.sel)S.cur='harbor';closeModal();toast(c3.name+' moved to trash');location.hash='admin-companies';return}
 if(a==='rm'){var m=S.companies[slug].members.splice(i,1)[0];log(S.user.name,'removed '+m.email+' from',S.companies[slug].name,'invites');render();toast('Removed '+m.name);return}
 if(a==='revoke'){var v=S.companies[slug].invites.splice(i,1)[0];log(S.user.name,'revoked invite for '+v.email+' in',S.companies[slug].name,'invites');render();toast('Invite revoked');return}
 if(a==='sup'){var p=S.people[i];p.sup=!p.sup;log(S.user.name,(p.sup?'granted':'revoked')+' super admin for',p.name,'people');render();return}

function vDash(){
 var p=curProj(),b=curBoard();if(!p||!b)return vHome();
 var cards=[];b.lists.forEach(function(l){l.cards.forEach(function(c){if(matches(c,b))cards.push({c:c,l:l})})});
 var now=Date.now(),done=cards.filter(function(x){return x.c.done}).length,over=cards.filter(function(x){return x.c.due&&x.c.due<now&&!x.c.done}).length,soon=cards.filter(function(x){return x.c.due&&x.c.due>=now&&x.c.due-now<2*DAY&&!x.c.done}).length;
 function bars(rows,colored){var mx=Math.max.apply(null,rows.map(function(r){return r.v}).concat([1]));return rows.map(function(r){return '<div class="hb"><span class="n">'+(r.n?av(r.n):'')+'<span style="overflow:hidden;text-overflow:ellipsis">'+esc(r.k)+'</span></span><div class="tr" role="img" aria-label="'+esc(r.k)+': '+r.v+'"><i style="width:'+Math.round(r.v/mx*100)+'%;'+(r.c?'background:'+r.c:'')+'"></i></div><span class="v">'+r.v+'</span></div>'}).join('')}
 var perList=b.lists.map(function(l){return {k:l.title,v:cards.filter(function(x){return x.l===l}).length}});
 var people=p.d.members.map(function(m){return {k:m.n,n:m.n,v:cards.filter(function(x){return x.c.members.indexOf(m.n)>=0}).length}});
 people.push({k:'Unassigned',v:cards.filter(function(x){return !x.c.members.length}).length});
 var perLab=b.labels.map(function(L){return {k:L.name,v:cards.filter(function(x){return x.c.labels.indexOf(L.id)>=0}).length,c:LCOL[L.c]}});
 var bk=[['Overdue',function(c){return c.due&&c.due<now&&!c.done},'var(--bad)'],['Next 24 hours',function(c){return c.due&&c.due>=now&&c.due-now<DAY&&!c.done},'var(--warn)'],['This week',function(c){return c.due&&c.due-now>=DAY&&c.due-now<7*DAY&&!c.done},'var(--accent)'],['Later',function(c){return c.due&&c.due-now>=7*DAY&&!c.done},'var(--muted)'],['No date',function(c){return !c.due&&!c.done},'var(--line)'],['Complete',function(c){return c.done},'var(--ok)']];
 var perDue=bk.map(function(x){return {k:x[0],v:cards.filter(function(y){return x[1](y.c)}).length,c:x[2]}});
 var h='<div class="bd" style="background:'+BG[b.bg]+'">'+topbar(p)+boardHeader(p,b)+zenStrip(p,b)+(fActive()?'<div class="fbar">'+ic('filter')+'Dashboard uses your current filter ('+cards.length+' cards)<button data-m="fclear">Clear filter</button></div>':'');

 h+='<div class="dgrid"><section class="dcard"><h3>Cards per list</h3>'+bars(perList)+'</section><section class="dcard"><h3>Cards per member</h3>'+bars(people)+'</section><section class="dcard"><h3>Cards per label</h3>'+bars(perLab)+'</section><section class="dcard"><h3>Due dates</h3>'+bars(perDue)+'</section><section class="dcard"><h3>Most votes</h3>'+(function(){var r=cards.filter(function(x){return x.c.votes.length}).sort(function(a,z){return z.c.votes.length-a.c.votes.length}).slice(0,6).map(function(x){return {k:x.c.title,v:x.c.votes.length}});return r.length?bars(r):'<p class="muted">No votes yet.</p>'})()+'</section></div></div></div>';

 var h='<div class="head"><div><h1>Integrations</h1><p class="muted">'+esc(T.co().name)+' · connect other tools with API tokens and webhooks</p></div><span class="sp"></span>'+tools()+'</div><div class="tabs2" role="tablist"><button class="'+(M.itab==='tokens'?'on':'')+'" data-m="itab" data-a="tokens">API tokens</button><button class="'+(M.itab==='hooks'?'on':'')+'" data-m="itab" data-a="hooks">Webhooks</button></div>';
 if(M.itab==='tokens'){h+='<section class="box"><div class="row"><div class="grow"><h2 style="margin:0">Company API tokens</h2><p class="muted" style="margin:4px 0 0">For other systems that talk to '+esc(T.co().name)+'. They work as a service, not as a person, and can be limited to chosen projects.</p></div><button class="btn primary" data-m="ctokn">'+ic('plus')+'New token</button></div><div class="tw" style="margin-top:14px"><table><thead><tr><th>Name</th><th>Access</th><th>Projects</th><th>Last used</th><th>Expires</th><th></th></tr></thead><tbody>'+CTOK.map(function(t,i){return '<tr><td><b>'+esc(t.name)+'</b><small class="muted" style="display:block">Created '+esc(t.created)+' by '+esc(t.by)+'</small></td><td>'+esc(t.scope)+'</td><td>'+esc(t.proj)+'</td><td class="muted">'+esc(t.last)+'</td><td class="muted">'+esc(t.exp)+'</td><td><button class="btn sm danger" data-m="ctokrev" data-a="'+i+'">Revoke</button></td></tr>'}).join('')+(CTOK.length?'':'<tr><td colspan="6" class="muted">No tokens yet.</td></tr>')+'</tbody></table></div></section><section class="box"><h2>Use a token</h2>'+termBox('it1','curl -H "Authorization: Bearer $TAZKO_TOKEN" \\\n  https://tazko-dev.hugepigstudio.com/api/v1/boards')+'<p class="hint">The full list of endpoints is in the API reference at <b>/api/docs</b>.</p></section>'}
 else{h+='<section class="box"><div class="row"><div class="grow"><h2 style="margin:0">Webhooks</h2><p class="muted" style="margin:4px 0 0">Tazko sends a signed message to your address when something happens.</p></div><button class="btn primary" data-m="hookn">'+ic('plus')+'Add webhook</button></div><div style="margin-top:12px">'+HOOKS.map(function(w,i){var open=M.hopen===w.id,dl=DLV.filter(function(d){return d.h===w.id});
  return '<div class="hook"><div class="row" style="flex-wrap:nowrap"><span class="pill '+(!w.on?'':w.ok?'ok':'bad')+'">'+(!w.on?'Paused':w.ok?'Healthy':'Failing')+'</span><div class="grow" style="min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(w.url)+'</b><small class="muted">'+w.events.length+' events · '+esc(w.proj)+' · last delivery '+esc(w.last)+'</small></div>'+sw('hooktog',i,w.on,'Active')+'<button class="btn sm" data-m="hookopen" data-a="'+w.id+'" aria-expanded="'+open+'">'+(open?'Hide':'Deliveries')+'</button></div>'
   +(open?'<div class="hookd"><div class="row" style="margin-bottom:8px"><small class="muted" style="flex:1">'+w.events.join(' · ')+'</small><button class="btn sm" data-m="hooktest" data-a="'+i+'">Send test event</button><button class="btn sm danger" data-m="hookdel" data-a="'+i+'">Delete</button></div><div class="tw"><table><thead><tr><th>When</th><th>Event</th><th>Result</th><th class="num">Time</th><th></th></tr></thead><tbody>'+dl.map(function(d){return '<tr><td class="muted">'+esc(d.t)+'</td><td class="mono">'+d.ev+'</td><td><span class="pill '+(d.code<300?'ok':'bad')+'">'+d.code+'</span></td><td class="num muted">'+d.ms+' ms</td><td>'+(d.code>=300?'<button class="btn sm" data-m="redeliver" data-a="'+w.id+'">Redeliver</button>':'')+'</td></tr>'}).join('')+(dl.length?'':'<tr><td colspan="5" class="muted">No deliveries yet.</td></tr>')+'</tbody></table></div><p class="hint" style="margin-top:8px">Each message carries an HMAC signature in the <b>Tazko-Signature</b> header. Failed deliveries retry with a growing delay for up to a day.</p></div>':'')+'</div>'}).join('')+(HOOKS.length?'':'<p class="muted">No webhooks yet.</p>')+'</div></section>'}
 return T.shell('app','integrations',h)}
H.itab=function(el){M.itab=A(el);T.render()};
H.ctokn=function(){T.openModal('<h2>New company token</h2>'+tokForm('ctok'))};
H.ctokrev=function(el){var t=CTOK.splice(+A(el),1)[0];T.log(ME,'revoked API token '+t.name+' in',T.co().name,'company');toast('Revoked '+t.name);T.render()};
H.hookn=function(){T.openModal('<h2>Add webhook</h2><form data-m-form="hook" novalidate><div class="field"><label for="hk-u">Address</label><input type="text" id="hk-u" placeholder="https://example.com/hooks/tazko"></div><div class="field"><label for="hk-p">Projects</label><select id="hk-p" style="width:100%"><option>All projects</option>'+projs().map(function(x){return '<option>'+esc(x.name)+'</option>'}).join('')+'</select></div><div class="field"><label>Events</label>'+EVS.map(function(e){return '<label class="opt"><input type="checkbox" name="hk-e" value="'+e+'" '+(e==='card.created'||e==='card.moved'?'checked':'')+'><span class="mono">'+e+'</span></label>'}).join('')+'</div><div class="acts"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">Add webhook</button></div></form>')};
H.hooktog=function(el){var w=HOOKS[+A(el)];w.on=!w.on;T.render()};
H.hookopen=function(el){M.hopen=M.hopen===A(el)?null:A(el);T.render()};
H.hooktest=function(el){var w=HOOKS[+A(el)];DLV.unshift({h:w.id,t:'Just now',ev:'ping',code:w.ok?200:502,ms:w.ok?120:5002});toast(w.ok?'Test event delivered (200)':'Test event failed (502)');T.render()};
H.hookdel=function(el){var w=HOOKS.splice(+A(el),1)[0];M.hopen=null;toast('Webhook deleted');T.render()};
H.redeliver=function(el){var w=HOOKS.filter(function(x){return x.id===A(el)})[0];DLV.unshift({h:w.id,t:'Just now',ev:'comment.created',code:502,ms:5004});toast('Redelivered. The endpoint still answers 502.');T.render()};
document.addEventListener('submit',function(e){var f=e.target.closest('form[data-m-form]');if(!f)return;var k=f.getAttribute('data-m-form');
 if(k==='ptok'||k==='ctok'){e.preventDefault();var n=$('#tk-n').value.trim();if(!n){$('#tk-n').focus();return}var sc=SCOPES.filter(function(s){return s[0]===$('#tk-s').value})[0][1],x=$('#tk-x').value,tok='tzk_'+(k==='ptok'?'pat':'svc')+'_'+rnd(32);
  if(k==='ptok')PTOK.unshift({id:nid('p'),name:n,scope:sc,created:'Today',last:'Never',exp:x});else CTOK.unshift({id:nid('t'),name:n,scope:sc,proj:$('#tk-p').value,created:'Today',last:'Never',exp:x==='No expiry'?x:'In '+x,by:ME});
  T.closeModal();tokenShown(n,tok);T.render()}
 if(k==='hook'){e.preventDefault();var u=$('#hk-u').value.trim();if(!/^https:\/\//i.test(u)){toast('The address must start with https://');return}var ev=$$('input[name=hk-e]:checked',f).map(function(i){return i.value});if(!ev.length){toast('Choose at least one event');return}
  HOOKS.unshift({id:nid('h'),url:u,events:ev,proj:$('#hk-p').value,on:true,last:'Never',ok:true});M.hopen=HOOKS[0].id;T.closeModal();T.openModal('<h2>Webhook added</h2><p class="muted">Use this secret to check the signature on each message. It is not shown again.</p><div class="term" id="whs" style="margin:10px 0">whsec_'+rnd(32)+'</div><div class="acts"><button class="btn" data-m="copyt" data-a="whs">'+ic('copy')+'Copy secret</button><button class="btn primary" data-act="close">Done</button></div>');T.render()}});

/* ---- listeners for the new controls ---- */
document.addEventListener('mousedown',function(e){if(e.target.closest&&e.target.closest('[data-rte]'))e.preventDefault()});
document.addEventListener('change',function(e){var t=e.target;if(!t.getAttribute)return;
 var pr=t.getAttribute('data-m-pr');if(pr){PR[pr]=t.value;applyPrefs();T.render();return}
 var mc=t.getAttribute('data-m-mc');if(mc){if(mc==='hide')M.mc.hide=t.checked;else M.mc[mc]=t.value;T.render();return}
 if(t.hasAttribute('data-m-lk')){PO.rel=t.value;renderPop();return}
 if(t.hasAttribute('data-m-itd')){var x=curItem();x.it.due=t.value?new Date(t.value+'T12:00:00').getTime():0;refresh();return}
 var bg=t.getAttribute('data-m-bgup');if(bg&&t.files&&t.files[0]){var fi=t.files[0];if(!/^image\//.test(fi.type)){toast('Choose an image file');return}if(fi.size>5e6){toast('Images must be 5 MB or smaller');return}
  var rd=new FileReader();rd.onload=function(){var key='u'+(Object.keys(CBG).length+1);CBG[key]=fi.name;BG[key]="url('"+rd.result+"') center/cover no-repeat";
   if(bg==='b'){curBoard().bg=key;logAct(curBoard(),null,'changed the background to an uploaded image');refresh();drawer()}
   else if(bg==='p'){curProj().d.bg=key;T.render()}
   else{var host=$('#nb-bg'),lab2=t.closest('label'),b2=document.createElement('button');b2.type='button';b2.className='sw';b2.style.background=BG[key];b2.setAttribute('data-m','nbbg');b2.setAttribute('data-a',key);b2.setAttribute('aria-label','Uploaded image');host.insertBefore(b2,lab2);H.nbbg(b2)}
   toast('Background uploaded')};rd.readAsDataURL(fi)}});
document.addEventListener('input',function(e){var t=e.target;
 if(t.id==='rte')M.descHtmlDraft=t.innerHTML;
 if(t.id==='zm'){PR.zoom=+t.value;applyPrefs();var o=$('#zmo');if(o)o.textContent=PR.zoom+'%'}
 if(t.id==='mc-q'){M.mc.q=t.value;var ps=t.selectionStart;T.render();var n=$('#mc-q');if(n){n.focus();n.setSelectionRange(ps,ps)}}
 if(t.id==='lk-q'){PO.q=t.value;var p2=t.selectionStart;renderPop();var n2=$('#lk-q');n2.focus();n2.setSelectionRange(p2,p2)}});

/* ---- voting and aging helpers ---- */
function lastActive(c){var t=c.act.length?c.act[0].t:0;c.comments.forEach(function(m){if(m.t>t)t=m.t});return t}
function projOfBoard(b){return projs().filter(function(x){return x.pid===b.pid})[0]}
function isStale(b,c){var p=projOfBoard(b);if(!p||c.done)return false;return Date.now()-lastActive(c)>=(p.d.agingDays||7)*DAY}
function agingLevel(b,c){var p=projOfBoard(b);if(!p||!p.d.aging||c.done)return 0;var T0=(p.d.agingDays||7)*DAY,age=Date.now()-lastActive(c);return age>=3*T0?3:age>=2*T0?2:age>=T0?1:0}
H.vote=function(el,e){e.stopPropagation();if(!can('edit')){ro();return}var f=findCard(A(el)),i=f.c.votes.indexOf(ME);if(i>=0)f.c.votes.splice(i,1);else f.c.votes.push(ME);logAct(f.b,f.c,(i>=0?'removed their vote from ':'voted for ')+f.c.title);refresh()};
document.addEventListener('change',function(e){var t=e.target;if(!t.hasAttribute)return;if(t.hasAttribute('data-m-ag')){curProj().d.agingDays=+t.value;T.render()}if(t.hasAttribute('data-m-stale')){M.stale=t.checked;rb()}});

T.routes.home=vHome;T.routes.project=vProject;T.routes.board=vBoard;T.routes.dashboard=vDash;T.routes.table=vTable;T.routes['my-cards']=vMyCards;T.routes['my-settings']=vMySettings;T.routes.integrations=vIntegrations;T.routes['cli-authorize']=vCliAuth;
applyPrefs();T.routes.templates=vTemplates;

T.routes.index=function(){var h=origIndex();var tile=function(k,t,s){return '<a class="tile" href="#" data-m="demo" data-a="'+k+'"><b>'+t+'</b><small>'+s+'</small></a>'};
 var sec=function(r,t,items){return '<div class="msh"><span class="pill accent">'+r+'</span><h2>'+t+'</h2></div><div class="grid">'+items.join('')+'</div>'};
 return h.replace(/<div class="msh"><h2>Next rounds[\s\S]*$/,sec('Round 2','M2 Projects and boards',[tile('projects','Your projects','Home for project members'),tile('project-boards','Project: boards','Starred, all, create, closed'),tile('project-members','Project: members','Invite, roles, pending'),tile('project-settings','Project: settings','Switches, color, background'),tile('board','Board','Drag, compose, shortcuts'),tile('card','Card','Everything on a card'),tile('filter','Filter','Members, labels, due dates'),tile('search','Search','Operators and results'),tile('zen','Zen mode','Press Z on a board'),tile('palette','Command palette','Ctrl K')])+sec('Round 3','M3 Live and files',[tile('attach','Attachments','Upload, link, cover'),tile('fields','Custom fields','Board menu'),tile('live','Live updates','Presence and simulation'),tile('notif','Notifications','Bell, mentions')])+sec('Round 4','M4 Templates and dashboard',[tile('templates','Templates','Preview and use'),tile('table','Table view','Sort, group, edit in place'),tile('dash','Dashboard','Charts from the board'),tile('mycards','My cards','Across all projects')])+sec('Round 5','Card depth',[tile('itemmeta','Checklist items','Assignee and due date'),tile('react','Reactions','On comments'),tile('recur','Recurring cards','Repeat on completion'),tile('links','Linked cards','Blocks, relates, duplicates'),tile('rte','Rich text','Description editor'),tile('vote','Voting','On cards and in the table'),tile('aging','Card aging','Project setting'),tile('longcard','Long cards','Card menu, show more, reorder')])+sec('Round 6','Settings, integration and email',[tile('set-profile','Settings: profile','Name, photo, language'),tile('set-appearance','Settings: appearance','Theme, zoom, time zone'),tile('set-notif','Settings: notifications','In-app and email'),tile('set-tokens','Settings: access tokens','Personal tokens'),tile('set-cli','Settings: command line','Install and examples'),tile('cli-auth','Authorize CLI','Device sign-in'),tile('int-tokens','Integrations: API tokens','Company tokens'),tile('int-hooks','Integrations: webhooks','Events and deliveries'),tile('bgup','Board background upload','Your own picture'),tile('emailprev','Email previews','Invite, mention, reminder'),tile('admin-email','Admin: email status','Server page')])+'</div>')};
T.after=function(h){stopLive();var vs=$('#viewas');if(vs)M.role=vs.value;
 var pb=$('#proto');if(pb)document.documentElement.style.setProperty('--pb',pb.offsetHeight+'px');
 if(h!=='board'&&h!=='table'&&M.cid){M.cid=null;var cmo=$('#cmov');if(cmo)cmo.hidden=true}syncZen();
 if(h!=='board'&&h!=='dashboard'&&h!=='table'){M.menuPage=null;drawer();if(h!=='templates'&&h!=='project'&&h!=='home')closePop()}
 if(h==='board'){var L=$('#lists');if(M.scroll&&L){L.scrollLeft=M.scroll.x;$$('.ls').forEach(function(s){var c=$('.cards',s),y=M.scroll.ys[s.getAttribute('data-list')];if(c&&y)c.scrollTop=y})}
  if(M.compose){var t=$('#cmp-t');if(t){t.focus();var c2=t.closest('.ls').querySelector('.cards');c2.scrollTop=c2.scrollHeight}}
  if(M.addList){var a=$('#al-t');if(a)a.focus()}if(M.live)startLive()}
 if(h==='table'&&M.tws){var tw=$('.tbw');if(tw){tw.scrollLeft=M.tws.x;tw.scrollTop=M.tws.y}}M.tws=null;
 M.scroll=null};
window.addEventListener('hashchange',closePop);
window.addEventListener('resize',function(){var pb=$('#proto');if(pb)document.documentElement.style.setProperty('--pb',pb.offsetHeight+'px')});
})();

route();
})();
