# cargo deny check licenses — run by scripts/ci.sh.
# Only permissive licenses (CLAUDE.md: MIT, Apache-2.0, BSD, ISC).
[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  # Needed by unicode-ident, which every proc-macro crate pulls in.
  # Permissive; record the exception in docs/decisions.md.
  "Unicode-3.0",
]
confidence-threshold = 0.9
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
