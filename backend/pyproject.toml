[project]
name = "tazko"
version = "0.1.0"
description = "Tazko API server and command-line client"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.4",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
tazko = "tazko.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tazko"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.uv]
# The lock file is the dependency list; CI and deploy install with --locked.
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = ["E501"]  # the formatter owns line length; long docstring lines are fine

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fake secrets are fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra --strict-markers --strict-config --import-mode=importlib"
# An xfail test that starts passing fails the run, so no test silently stops checking anything.
xfail_strict = true
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["tazko"]

[tool.coverage.report]
# The floor (D20): just under the current level, only ever raised. scripts/ci.sh enforces it,
# so running one test file while working does not fail on coverage.
fail_under = 92
skip_covered = true
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
